<!-- ===== MOD MANAGER VIEW ===== -->
<div class="view hidden" id="view-mod-manager">
    <div class="mod-manager-wrapper">

        <!-- Banner -->
        <div class="mod-manager-banner">
            <div class="mod-manager-banner-left">
                <h2 class="mod-manager-banner-title">🧩 功能模組管理中心</h2>
                <p class="mod-manager-banner-sub">管理雪莉的所有可插拔功能模組，開啟或停用後請點擊上方頂欄按鈕重啟雪莉生效。</p>
            </div>
            <div class="mod-manager-stats" id="mod-manager-stats"></div>
        </div>

        <!-- Notice Bar -->
        <div class="mod-notice-bar" id="mod-notice-bar" style="display:none;">
            ⚠️ 模組設定已變更，請點擊上方頂欄「🔄 重啟雪莉」按鈕以套用。
        </div>

        <!-- Module Grid -->
        <div class="mod-grid" id="mod-grid">
            <div class="mod-loading">
                <div class="mod-loading-spinner"></div>
                <span>正在掃描模組清單...</span>
            </div>
        </div>

    </div>
</div>
