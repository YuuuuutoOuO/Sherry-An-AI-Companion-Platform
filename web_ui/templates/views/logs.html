<!-- ===== LOG VIEW ===== -->
<div class="view hidden" id="view-logs">
    <div class="logs-wrapper">
        <div class="logs-container" id="logs-container">
            <div class="placeholder-msg">正在載入日誌...</div>
        </div>
        <!-- 分頁控制 -->
        <div class="pagination" id="pagination">
            <button class="page-btn" id="prev-btn" onclick="changePage(-1)" disabled>‹ 上一頁</button>
            <span class="page-info" id="page-info">— / —</span>
            <button class="page-btn" id="next-btn" onclick="changePage(1)" disabled>下一頁 ›</button>
        </div>
    </div>
</div>
