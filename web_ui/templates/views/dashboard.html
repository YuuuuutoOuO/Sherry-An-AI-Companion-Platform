<!-- ===== DASHBOARD VIEW (DEFAULT LANDING PAGE) ===== -->
<div class="view active" id="view-dashboard">
    <div class="dashboard-wrapper">
        <!-- Dashboard Hero -->
        <section class="dashboard-banner dashboard-hero">
            <div class="dashboard-hero-main">
                <div class="hero-eyebrow"><span class="hero-pulse"></span> System Overview</div>
                <h2 class="dashboard-banner-title">雪莉名偵探 · 控制台總覽</h2>
                <p class="dashboard-banner-sub">歡迎回來。這裡整合雪莉的即時運轉狀態、Git 版本資訊與各項核心服務，讓你一眼掌握整個系統。</p>
                <div class="hero-tags">
                    <span class="hero-tag hero-tag--accent">● 即時監控</span>
                    <span class="hero-tag">5s Auto Refresh</span>
                    <span class="hero-tag">Secure Console</span>
                </div>
            </div>
            <div class="dashboard-banner-right">
                <span class="hero-version-label">Build</span>
                <span class="service-badge service-online" id="dashboard-version-tag">v1.9.0-dev</span>
            </div>
        </section>

        <!-- Git Status & Version Card -->
        <div id="dashboard-git-container" class="dashboard-git-container">
            <div class="git-card">
                <div class="skeleton skeleton-line w-40"></div>
                <div class="skeleton skeleton-line w-75" style="margin-top: 12px;"></div>
                <div class="skeleton skeleton-line w-60"></div>
            </div>
        </div>

        <!-- Core Status Grid -->
        <div id="dashboard-core-grid" class="dashboard-core-grid">
            <div class="metric-card"><div class="skeleton skeleton-line w-60"></div><div class="skeleton skeleton-line w-40" style="margin-top: 12px;"></div></div>
            <div class="metric-card"><div class="skeleton skeleton-line w-60"></div><div class="skeleton skeleton-line w-40" style="margin-top: 12px;"></div></div>
            <div class="metric-card"><div class="skeleton skeleton-line w-60"></div><div class="skeleton skeleton-line w-40" style="margin-top: 12px;"></div></div>
            <div class="metric-card"><div class="skeleton skeleton-line w-60"></div><div class="skeleton skeleton-line w-40" style="margin-top: 12px;"></div></div>
            <div class="metric-card"><div class="skeleton skeleton-line w-60"></div><div class="skeleton skeleton-line w-40" style="margin-top: 12px;"></div></div>
        </div>

        <!-- Quick Navigation Jumps -->
        <section class="dashboard-quicknav">
            <h3 class="dashboard-quicknav-title">快捷觀測與功能跳轉</h3>
            <div class="dashboard-quicknav-grid">
                <div class="quick-card" onclick="switchView('chat')">
                    <div class="quick-card-icon">
                        <svg class="nav-svg" viewBox="0 0 24 24" aria-hidden="true"><use href="#i-chat"></use></svg>
                    </div>
                    <div class="quick-card-body">
                        <div class="quick-card-name">雪莉測試室</div>
                        <div class="quick-card-desc">測試對話與意圖觸發</div>
                    </div>
                    <span class="quick-card-arrow">→</span>
                </div>
                <div class="quick-card" onclick="switchView('bot-status')">
                    <div class="quick-card-icon">
                        <svg class="nav-svg" viewBox="0 0 24 24" aria-hidden="true"><use href="#i-music"></use></svg>
                    </div>
                    <div class="quick-card-body">
                        <div class="quick-card-name">語音與音樂監控</div>
                        <div class="quick-card-desc">查看語音房間與播放動態</div>
                    </div>
                    <span class="quick-card-arrow">→</span>
                </div>
                <div class="quick-card" onclick="switchView('tasks')">
                    <div class="quick-card-icon">
                        <svg class="nav-svg" viewBox="0 0 24 24" aria-hidden="true"><use href="#i-tasks"></use></svg>
                    </div>
                    <div class="quick-card-body">
                        <div class="quick-card-name">即時工作與自癒</div>
                        <div class="quick-card-desc">推論佇列、活躍任務與音樂續播</div>
                    </div>
                    <span class="quick-card-arrow">→</span>
                </div>
                <div class="quick-card" onclick="switchView('services')">
                    <div class="quick-card-icon">
                        <svg class="nav-svg" viewBox="0 0 24 24" aria-hidden="true"><use href="#i-services"></use></svg>
                    </div>
                    <div class="quick-card-body">
                        <div class="quick-card-name">地端 AI 服務診斷</div>
                        <div class="quick-card-desc">Ollama / LMS / SD 狀態</div>
                    </div>
                    <span class="quick-card-arrow">→</span>
                </div>
                <div class="quick-card" onclick="switchView('logs')">
                    <div class="quick-card-icon">
                        <svg class="nav-svg" viewBox="0 0 24 24" aria-hidden="true"><use href="#i-logs"></use></svg>
                    </div>
                    <div class="quick-card-body">
                        <div class="quick-card-name">即時日誌明細</div>
                        <div class="quick-card-desc">檢視 runtime_log 落盤</div>
                    </div>
                    <span class="quick-card-arrow">→</span>
                </div>
                <div class="quick-card" onclick="switchView('settings')">
                    <div class="quick-card-icon">
                        <svg class="nav-svg" viewBox="0 0 24 24" aria-hidden="true"><use href="#i-settings"></use></svg>
                    </div>
                    <div class="quick-card-body">
                        <div class="quick-card-name">系統與靈魂設定</div>
                        <div class="quick-card-desc">模型選取與人設調整</div>
                    </div>
                    <span class="quick-card-arrow">→</span>
                </div>
            </div>
        </section>
    </div>
</div>
